apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training
  namespace: mlops
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: cifar10-training
    spec:
      restartPolicy: Never

      containers:
        - name: training
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent

          args:
            - "--config"
            - "/app/config/training_config.yaml"

          volumeMounts:
            - name: data
              mountPath: /app/data

            - name: checkpoints
              mountPath: /app/checkpoints

            - name: training-config
              mountPath: /app/config/training_config.yaml
              subPath: training_config.yaml

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlops-data-pvc

        - name: checkpoints
          persistentVolumeClaim:
            claimName: mlops-checkpoints-pvc

        - name: training-config
          configMap:
            name: training-config
