project:
  name: cifar10-resnet18

data:
  data_dir: data
  num_workers: 0
  max_train_samples: 1024
  max_test_samples: 512

training:
  batch_size: 64
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 2

optimizer:
  name: adam

output:
  checkpoint_dir: checkpoints
  checkpoint_name: model.pt
  metrics_file: metrics.jsonl